name: 脉书 iOS 构建
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unsigned:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 安装 CocoaPods 依赖
        run: |
          cd ios/App
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" Podfile
          pod install --repo-update

      - name: 构建未签名 .app
        run: |
          set -e
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -40

      - name: 打包 IPA
        run: |
          set -e
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry 脉书-1.0.0-unsigned.ipa Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: maishu-ios-unsigned
          path: "*.ipa"
          retention-days: 7
